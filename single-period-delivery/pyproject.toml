[project]
name = "single-period-delivery"
version = "0.1.0"
description = "Single-period Product Distribution Optimization Using Column Generation Algorithm and Two-Stage Heuristic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gurobipy==12.0.3",
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "rich>=10.0.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
# CPLEX Python API ("cplex") plus the "docplex" helper whose `config --upgrade`
# command upgrades the bundled Community Edition runtime to the size-unlimited
# CPLEX Studio runtime. See docs/uv_environment.md.
cplex = [
    "cplex==22.1.2.0",
    "docplex==2.32.264",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.6.0",
]

[project.scripts]
single-period-delivery = "single_period_delivery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["single_period_delivery*"]

# The portfolio root also carries tests with the same file names, and the
# combined run uses --import-mode=importlib (see ../../pytest.ini). Setting it
# here keeps a run from inside this project consistent with the combined run.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

# Lint gate enforced by CI (.github/workflows/ci.yml).
#
# The rule set is grown deliberately ("almost certainly a bug" first) instead of
# switching on ruff's full default set: this code base still carries
# modernization debt (typing.List -> list, ...) and a gate that is red from the
# first push gets ignored.
#
#   E4/E7/E9  pycodestyle errors
#   F         pyflakes (unused imports, undefined names, ...)
#   I         import sorting
#
# Next candidate: UP (pyupgrade) - roughly 700 findings, most auto-fixable.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
