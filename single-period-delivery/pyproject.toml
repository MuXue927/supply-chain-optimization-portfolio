[project]
name = "single-period-delivery"
version = "0.1.0"
description = "Single-period Product Distribution Optimization Using Column Generation Algorithm and Two-Stage Heuristic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gurobipy==12.0.3",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "rich>=14.2.0",
    "seaborn>=0.13.2",
]

[project.scripts]
single-period-delivery = "single_period_delivery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["single_period_delivery*"]
