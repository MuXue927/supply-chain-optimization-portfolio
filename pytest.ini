; Pytest configuration for the whole portfolio.
;
; Both subprojects ship tests with the same file names (for example
; ``test_cli.py`` and ``test_cplex_api.py``). Running them together with the
; default "prepend" import mode makes pytest import the second file under the
; same module name and error during collection, so the combined run uses
; ``--import-mode=importlib``.
;
; ``testpaths`` keeps a bare ``pytest`` (run from the repository root) limited
; to the two test suites instead of recursing into generated output folders
; such as ``outputs/`` and ``.venv/``.
[pytest]
addopts = --import-mode=importlib
testpaths =
    multi-period-delivery/tests
    single-period-delivery/tests
norecursedirs =
    .git
    .venv
    venv
    .tox
    .nox
    build
    dist
    outputs
    results
    local-only
    node_modules
    *.egg-info
