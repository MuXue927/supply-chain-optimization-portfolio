name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint and test (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock

      # One locked environment for the whole workspace: uv reads
      # .python-version (3.10) and uv.lock, then installs both workspace
      # members in editable mode plus the dev group (pytest, ruff).
      # The optional `cplex` extra is deliberately not synced here, so the
      # CPLEX tests keep skipping themselves through pytest.importorskip.
      - name: Sync the workspace environment
        run: uv sync

      # Ruff picks up the nearest pyproject.toml, so each project is checked
      # against its own [tool.ruff.lint] baseline.
      - name: Lint
        run: |
          .venv/bin/python -m ruff check single-period-delivery
          .venv/bin/python -m ruff check multi-period-delivery

      # The root pytest.ini adds --import-mode=importlib and limits collection
      # to the two tests/ directories. Coverage is measured over the two
      # packages only, and --cov-branch reports branch coverage as well as
      # statements: a line that runs but whose decision is never seen to go the
      # other way no longer counts as covered.
      #
      # Threshold: 64, from the CI baseline measured on run 40360689993
      # (2026-10-27): 64.56%, minus 0.5pp of headroom, rounded down to the
      # nearest 0.5. The gap is deliberately under 1pp so the gate still has
      # signal - the previous value (56) had been left 11pp below the measured
      # baseline since 05e71b0, which meant deleting an entire test file would
      # not have turned CI red.
      #
      # Take the baseline from **CI**, not from a local run: CI skips four
      # CPLEX tests and measures ~2pp lower than a local Windows run, so a
      # local number here would leave the gate too slack to catch anything.
      # The Gurobi-backed modules still cannot run without a licence, so those
      # paths stay uncovered by design rather than being mocked.
      - name: Test with coverage
        run: |
          .venv/bin/python -m pytest -q \
            --cov=multi_period_delivery \
            --cov=single_period_delivery \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=64
