name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint and test (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock

      # One locked environment for the whole workspace: uv reads
      # .python-version (3.10) and uv.lock, then installs both workspace
      # members in editable mode plus the dev group (pytest, ruff).
      # The optional `cplex` extra is deliberately not synced here, so the
      # CPLEX tests keep skipping themselves through pytest.importorskip.
      - name: Sync the workspace environment
        run: uv sync

      # Ruff picks up the nearest pyproject.toml, so each project is checked
      # against its own [tool.ruff.lint] baseline.
      - name: Lint
        run: |
          .venv/bin/python -m ruff check single-period-delivery
          .venv/bin/python -m ruff check multi-period-delivery

      # The root pytest.ini adds --import-mode=importlib and limits collection
      # to the two tests/ directories.
      - name: Test
        run: .venv/bin/python -m pytest -q
