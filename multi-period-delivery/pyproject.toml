[project]
name = "multi-period-delivery"
version = "0.1.0"
description = "Multi-period production-driven product distribution optimization using adaptive large neighborhood search and an ILP benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alns>=1.0.0",
    "numpy>=1.21.0",
    "numba>=0.59.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.0.0",
    "gurobipy>=10.0.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
    "networkx>=2.8.0",
    "plotly>=5.0.0",
    "vrplib>=1.4.0",
    "rich>=10.0.0",
]

[project.scripts]
multi-period-delivery = "multi_period_delivery.cli:main"

[project.optional-dependencies]
# CPLEX Python API ("cplex") plus the "docplex" helper whose `config --upgrade`
# command upgrades the bundled Community Edition runtime to the size-unlimited
# CPLEX Studio runtime. See docs/uv_environment.md.
cplex = [
    "cplex==22.1.2.0",
    "docplex==2.32.264",
]
# Development dependencies used for testing, profiling and linting.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0.0",
    "pyinstrument>=5.1.1",
    "black>=23.0.0",
    "mypy>=1.8.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["multi_period_delivery*"]

# The portfolio root also carries tests with the same file names, and the
# combined run uses --import-mode=importlib (see ../../pytest.ini). Setting it
# here keeps a run from inside this project consistent with the combined run.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

# Lint gate enforced by CI (.github/workflows/ci.yml).
#
# The rule set is grown deliberately ("almost certainly a bug" first) instead of
# switching on ruff's full default set: this code base still carries
# modernization debt (typing.List -> list, ...) and a gate that is red from the
# first push gets ignored.
#
#   E4/E7/E9  pycodestyle errors
#   F         pyflakes (unused imports, undefined names, ...)
#   I         import sorting
#
# Next candidate: UP (pyupgrade) - roughly 700 findings, most auto-fixable.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
